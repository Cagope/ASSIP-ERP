<div class="layout">

  <!-- ================== SIDEBAR ================== -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="title">ASSIP-ERP</span>
    </div>

    <app-main-menu></app-main-menu>
  </aside>

  <!-- ================== ÁREA DERECHA ================== -->
  <div class="content-area">

    <!-- ================== HEADER SUPERIOR ================== -->
    <header class="header">

      <div class="header-left" *ngIf="agenciaActual">
        {{ agenciaActual.codigoAgencia }} — {{ agenciaActual.nombreAgencia }}
      </div>

      <div class="header-right">
        <span class="user">👤 {{ username }}</span>
        <button class="logout" (click)="logout()">Cerrar sesión</button>
      </div>

    </header>

    <!-- ================== CONTENIDO ================== -->
    <main class="main">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
