<div class="layout">

  <!-- ================== HEADER PRINCIPAL ================== -->
  <header class="header">

    <!-- 🟩 Línea 1 -->
    <div class="header-top">

      <div class="left">
        <img src="assets/logo-web.png" alt="Logo ASSIP ERP" class="logo" />
        <span class="title">ASSIP-ERP</span>
      </div>

      <div class="center" *ngIf="agenciaActual">
        {{ agenciaActual.codigoAgencia }} — {{ agenciaActual.nombreAgencia }}
      </div>

      <div class="right">
        <span class="user">👤 {{ username }}</span>
        <button class="logout" (click)="logout()">Cerrar sesión</button>
      </div>

    </div>

    <!-- 🟨 Línea 2: MENÚ -->
    <div class="header-menu">
      <app-main-menu></app-main-menu>
    </div>

  </header>

  <!-- ================== CONTENIDO ================== -->
  <main class="main">
    <router-outlet></router-outlet>
  </main>

</div>
