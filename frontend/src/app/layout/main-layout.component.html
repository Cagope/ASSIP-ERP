<div class="layout">

  <!-- 🟩 CABECERA SUPERIOR -->
  <header class="header">
    <div class="left">
      <img src="assets/logo-web.png" alt="Logo ASSIP ERP" class="logo" />
      <span class="title">ASSIP ERP</span>
    </div>

    <div class="right">

      <!-- 🏢 Agencia activa -->
      <span *ngIf="agenciaActual" class="agency">
    🏢 {{ agenciaActual.codigo_agencia }} — {{ agenciaActual.nombre_agencia }}
  </span>

      <span class="user">👤 {{ username }}</span>
      <button class="logout" (click)="logout()">Cerrar sesión</button>
    </div>

  </header>

  <!-- 📋 CUERPO GENERAL -->
  <div class="main">
    <aside class="sidebar">
      <app-main-menu></app-main-menu>
    </aside>

    <section class="content">
      <router-outlet></router-outlet>
    </section>
  </div>

</div>
