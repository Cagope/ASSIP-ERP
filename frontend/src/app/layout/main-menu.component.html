<aside class="menu">
  <nav class="menu-content">
    <ul>
      <li *ngFor="let section of menu; let i = index" [class.open]="isOpen(i)">

        <!-- 🔽 TÍTULO CLICABLE -->
        <button type="button" class="menu-section" (click)="toggleSection(i)">
          <span>{{ section.title }}</span>
          <span class="chevron" [class.open]="isOpen(i)">▾</span>
        </button>

        <!-- 🔽 SUBMENÚ SOLO SI ESTÁ ABIERTO -->
        <ul class="submenu" *ngIf="isOpen(i)">
          <li *ngFor="let item of section.items">
            <a
              [routerLink]="item.route"
              routerLinkActive="active"
              class="menu-item"
            >
              • {{ item.label }}
            </a>
          </li>
        </ul>

      </li>
    </ul>
  </nav>
</aside>
