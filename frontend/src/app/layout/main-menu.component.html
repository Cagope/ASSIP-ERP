
<!-- =========================================================
     ASSIP ERP - MENÚ LATERAL
     Navegación institucional COOPVALLE
     ========================================================= -->

<nav class="side-menu">

  <ul class="menu-root">

    <!-- NIVEL 1: MÓDULOS PRINCIPALES -->
    <li
      class="menu-section"
      *ngFor="let section of menu; let i = index"
      [hidden]="!seccionVisible(section)"
      [class.open]="isOpen(i)"
      [class.open-section]="isOpen(i)"
      [class.active-section]="seccionActiva(section)">

      <button
        type="button"
        class="menu-title"
        [attr.aria-expanded]="isOpen(i)"
        (click)="toggleSection(i)">

        <span class="menu-title-content">

          <lucide-icon
            *ngIf="section.icon"
            [img]="icons[section.icon]"
            class="menu-icon">
          </lucide-icon>

          <span>{{ section.title }}</span>

        </span>

        <span class="arrow">
          {{ isOpen(i) ? '▾' : '▸' }}
        </span>

      </button>

      <!-- NIVEL 2: OPCIONES DEL MÓDULO -->
      <ul
        class="menu-items"
        *ngIf="isOpen(i)">

        <ng-container
          *ngFor="let item of section.items; let gi = index">

          <!-- OPCIÓN SIMPLE NIVEL 2 -->
          <li
            *ngIf="tienePermiso(item) && !item.children">

            <a
              class="menu-item"
              [routerLink]="item.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="closeMenu(i)">

              {{ item.label }}

            </a>

          </li>

          <!-- GRUPO NIVEL 2 -->
          <li
            class="menu-group"
            *ngIf="tienePermiso(item) && item.children"
            [class.active-group]="grupoActivo(item)"
            [class.open-group]="isGroupOpen(gi)">

            <button
              type="button"
              class="menu-group-title"
              [attr.aria-expanded]="isGroupOpen(gi)"
              (click)="toggleGroup(gi)">

              <span>{{ item.label }}</span>

              <span class="group-arrow">
                {{ isGroupOpen(gi) ? '▾' : '▸' }}
              </span>

            </button>

            <!-- NIVEL 3: OPCIONES DEL GRUPO -->
            <ul
              class="menu-subitems"
              *ngIf="isGroupOpen(gi)">

              <ng-container
                *ngFor="let child of item.children; let si = index">

                <!-- OPCIÓN SIMPLE NIVEL 3 -->
                <li
                  *ngIf="tienePermiso(child) && !child.children">

                  <a
                    class="menu-subitem"
                    [routerLink]="child.route"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: true }"
                    (click)="closeMenu(i)">

                    {{ child.label }}

                  </a>

                </li>

                <!-- SUBGRUPO NIVEL 3 -->
                <li
                  class="menu-subgroup"
                  *ngIf="tienePermiso(child) && child.children"
                  [class.active-subgroup]="grupoActivo(child)"
                  [class.open-subgroup]="isSubGroupOpen(gi, si)">

                  <button
                    type="button"
                    class="menu-subgroup-title"
                    [attr.aria-expanded]="isSubGroupOpen(gi, si)"
                    (click)="toggleSubGroup(gi, si)">

                    <span>{{ child.label }}</span>

                    <span class="subgroup-arrow">
                      {{ isSubGroupOpen(gi, si) ? '▾' : '▸' }}
                    </span>

                  </button>

                  <!-- NIVEL 4: OPCIONES DEL SUBGRUPO -->
                  <ul
                    class="menu-sublevel-items"
                    *ngIf="isSubGroupOpen(gi, si)">

                    <ng-container
                      *ngFor="let subchild of child.children">

                      <li
                        *ngIf="tienePermiso(subchild)">

                        <a
                          class="menu-sublevel-item"
                          [routerLink]="subchild.route"
                          routerLinkActive="active"
                          [routerLinkActiveOptions]="{ exact: true }"
                          (click)="closeMenu(i)">

                          {{ subchild.label }}

                        </a>

                      </li>

                    </ng-container>

                  </ul>

                </li>

              </ng-container>

            </ul>

          </li>

        </ng-container>

      </ul>

    </li>

  </ul>

</nav>
