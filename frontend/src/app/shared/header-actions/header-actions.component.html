<div class="header-actions">
  <h2>{{ titulo }}</h2>

  <div class="actions">

    <button
      *ngIf="mostrarNuevo"
      class="btn btn--primary"
      (click)="onNuevo()">
      ➕ Nueva
    </button>

    <button
      *ngIf="mostrarImprimir"
      class="btn btn--secondary"
      (click)="onImprimir()">
      🖨️ Imprimir
    </button>

    <button
      *ngIf="mostrarExportar"
      class="btn btn--secondary"
      (click)="onExportar()">
      📤 Exportar
    </button>

  </div>
</div>
