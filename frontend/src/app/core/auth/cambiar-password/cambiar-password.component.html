<div class="password-page">

  <div class="password-card">

    <!-- ENCABEZADO -->

    <div class="password-header">

      <img
        src="assets/logo-web.png"
        alt="Logo de la empresa"
        class="password-logo"
      />

      <h1>Cambio de contraseña</h1>

      <p>
        Actualice su contraseña de acceso.
        Por seguridad, deberá iniciar sesión
        nuevamente después del cambio.
      </p>

    </div>

    <!-- FORMULARIO -->

    <form
      [formGroup]="form"
      (ngSubmit)="guardar()"
      novalidate
    >

      <!-- CONTRASEÑA ACTUAL -->

      <div class="field">

        <label for="passwordActual">
          Contraseña actual
        </label>

        <div class="password-input">

          <input
            id="passwordActual"
            name="passwordActual"
            [type]="showActual() ? 'text' : 'password'"
            formControlName="passwordActual"
            autocomplete="current-password"
            placeholder="Ingrese su contraseña actual"
          />

          <button
            type="button"
            class="show-button"
            [attr.aria-label]="showActual()
              ? 'Ocultar contraseña actual'
              : 'Mostrar contraseña actual'"
            (click)="showActual.set(!showActual())"
          >
            {{ showActual() ? '🙈' : '👁️' }}
          </button>

        </div>

      </div>

      <!-- NUEVA CONTRASEÑA -->

      <div class="field">

        <label for="passwordNueva">
          Nueva contraseña
        </label>

        <div class="password-input">

          <input
            id="passwordNueva"
            name="passwordNueva"
            [type]="showNueva() ? 'text' : 'password'"
            formControlName="passwordNueva"
            autocomplete="new-password"
            placeholder="Ingrese su nueva contraseña"
          />

          <button
            type="button"
            class="show-button"
            [attr.aria-label]="showNueva()
              ? 'Ocultar nueva contraseña'
              : 'Mostrar nueva contraseña'"
            (click)="showNueva.set(!showNueva())"
          >
            {{ showNueva() ? '🙈' : '👁️' }}
          </button>

        </div>

      </div>

      <!-- CONFIRMACIÓN -->

      <div class="field">

        <label for="confirmacion">
          Confirmar nueva contraseña
        </label>

        <div class="password-input">

          <input
            id="confirmacion"
            name="confirmacion"
            [type]="showConfirmacion() ? 'text' : 'password'"
            formControlName="confirmacion"
            autocomplete="new-password"
            placeholder="Confirme su nueva contraseña"
          />

          <button
            type="button"
            class="show-button"
            [attr.aria-label]="showConfirmacion()
              ? 'Ocultar confirmación'
              : 'Mostrar confirmación'"
            (click)="showConfirmacion.set(!showConfirmacion())"
          >
            {{ showConfirmacion() ? '🙈' : '👁️' }}
          </button>

        </div>

      </div>

      <!-- MENSAJE DE ERROR -->

      <div
        *ngIf="errorMsg()"
        class="error"
        role="alert"
      >
        {{ errorMsg() }}
      </div>

      <!-- ACCIONES -->

      <div class="password-actions">

        <button
          type="submit"
          class="submit-button"
          [disabled]="form.invalid || loading()"
        >
          {{
          loading()
          ? 'Actualizando...'
          : 'Cambiar contraseña'
          }}
        </button>

        <button
          type="button"
          class="cancel-button"
          [disabled]="loading()"
          (click)="cancelar()"
        >
          Cancelar
        </button>

      </div>

    </form>

  </div>

</div>
