<div class="page">

  <!-- ========================================================= -->
  <!-- 🟦 ENCABEZADO GLOBAL DEL MÓDULO                           -->
  <!-- ========================================================= -->
  <app-header-actions
    titulo="🏦 Proceso — Revalorización de Aportes"
    [mostrarNuevo]="false"
    [mostrarImprimir]="false"
    [mostrarExportar]="false">
  </app-header-actions>

  <!-- ========================================================= -->
  <!-- 🔍 FILTROS                                                -->
  <!-- ========================================================= -->
  <form class="filtros" (ngSubmit)="ejecutar()">

    <!-- 🏛 Agencia -->
    <div class="f-row">
      <label>Agencia</label>
      <select [(ngModel)]="filtros.agenciaId" name="agenciaId">
        <option value="0">Todas</option>
        <option *ngFor="let a of agencias" [value]="a.idAgencia">
          {{ a.nombreAgencia }}
        </option>
      </select>
    </div>

    <!-- 📆 Fecha inicio -->
    <div class="f-row">
      <label>Fecha inicio</label>
      <input type="date" [(ngModel)]="filtros.fechaInicio" name="fechaInicio" />
    </div>

    <!-- 📆 Fecha fin -->
    <div class="f-row">
      <label>Fecha fin</label>
      <input type="date" [(ngModel)]="filtros.fechaFin" name="fechaFin" />
    </div>

    <!-- 📆 Fecha contabilización -->
    <div class="f-row">
      <label>Fecha contabilización</label>
      <input type="date" [(ngModel)]="filtros.fechaContabilizacion" name="fechaContabilizacion" />
    </div>

    <!-- 💲 Tasa (%) -->
    <div class="f-row">
      <label>Tasa (%)</label>
      <input type="number" step="0.01" [(ngModel)]="filtros.tasa" name="tasa" />
    </div>

    <!-- 🔘 BOTONES -->
    <div class="f-buttons">
      <button type="submit" class="btn btn--primary">
        ⚙️ Ejecutar proceso
      </button>

      <button type="button" class="btn btn--cancel" (click)="limpiar()">
        🧹 Limpiar
      </button>
    </div>

  </form>

  <!-- ========================================================= -->
  <!-- ESTADOS -->
  <!-- ========================================================= -->
  <div *ngIf="cargando" class="loading">Procesando...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <!-- ========================================================= -->
  <!-- 🧮 RESULTADOS                                             -->
  <!-- ========================================================= -->
  <div *ngIf="resultados.length > 0" class="resultados">

    <h3 class="mt-3">Resultados del proceso</h3>

    <!-- ========================================================= -->
    <!-- BOTONES EXPORTAR / IMPRIMIR (igual a saldos-corte)       -->
    <!-- ========================================================= -->
    <div class="header-actions" style="margin-top: 10px;">
      <div class="actions">

        <button class="btn btn--primary"
                type="button"
                (click)="exportar()"
                [disabled]="resultados.length === 0">
          📥 Exportar Excel
        </button>

        <button class="btn btn--print"
                type="button"
                (click)="imprimir()"
                [disabled]="resultados.length === 0">
          🖨️ Imprimir
        </button>

      </div>
    </div>

    <!-- ================= TABLA DE DETALLE ====================== -->
    <table class="tabla-resumen">
      <thead>
      <tr>
        <th>Documento</th>
        <th>Nombre</th>
        <th class="right">Saldo actual</th>
        <th class="right">Promedio</th>
        <th class="right">Revalorización</th>
        <th>Estado</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let r of resultados">
        <td>{{ r.documento }}</td>
        <td>{{ r.nombreCompleto }}</td>
        <td class="right">{{ r.saldoActual | number:'1.0-0' }}</td>
        <td class="right">{{ r.valorPromedio | number:'1.0-0' }}</td>
        <td class="right">{{ r.valorRevalorizacion | number:'1.0-0' }}</td>
        <td>{{ r.estadoCuenta }}</td>
      </tr>
      </tbody>

    </table>

  </div>

</div>
