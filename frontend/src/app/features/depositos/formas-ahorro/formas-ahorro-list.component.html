<div class="formas-ahorro-list">

  <app-header-actions
    titulo="Formas de Ahorro"
    (nuevo)="nueva()"
    (refrescar)="cargar()"
    (imprimir)="imprimir()"
    (exportar)="exportar()">
  </app-header-actions>

  <table class="table" *ngIf="!cargando && formas.length > 0; else vacio">
    <thead>
    <tr>
      <th>Código</th>
      <th>Nombre</th>
      <th>Tipo</th>
      <th>liq.</th>
      <th>Aut</th>
      <th>Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr *ngFor="let f of formas">
      <td>{{ f.codigoForma }}</td>
      <td>{{ f.nombreForma }}</td>
      <td>{{ f.tipoCaptacion }}</td>
      <td>{{ f.tiempoLiquidacion }}</td>
      <td>{{ f.autorizadoForma ? 'SI' : 'NO' }}</td>

      <td>
        <div class="acciones">
          <button
            class="btn-action-edit"
            type="button"
            (click)="editar(f.id!)"
            title="Editar">
            ✏️
          </button>

          <button
            class="btn-action-delete"
            type="button"
            (click)="eliminar(f)"
            title="Eliminar">
            🗑️
          </button>
        </div>
      </td>
    </tr>
    </tbody>
  </table>

  <div *ngIf="cargando" class="loading">
    Cargando...
  </div>

  <ng-template #vacio>
    <p class="empty">No hay formas de ahorro registradas.</p>
  </ng-template>

</div>
