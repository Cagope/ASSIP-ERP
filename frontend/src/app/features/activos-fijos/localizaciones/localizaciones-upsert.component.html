<div class="page">

  <div class="card localizacion-form-card">

    <div class="form-title">
      <h3>
        {{ route.snapshot.paramMap.get('id') ? 'Editar localización' : 'Nueva localización' }}
      </h3>
      <p>Registro de localizaciones por agencia</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="guardar()" class="form-grid">

      <div class="form-group full">
        <label>Nombre *</label>
        <input
          type="text"
          class="form-control"
          formControlName="nombre" />
      </div>

      <div class="form-group sm">
        <label>Teléfono</label>
        <input
          type="text"
          class="form-control"
          formControlName="telefono" />
      </div>

      <div class="form-group full">
        <label>Agencia *</label>
        <select
          class="form-control"
          formControlName="idAgencia">
          <option [ngValue]="null">-- Seleccione --</option>
          <option *ngFor="let a of agencias" [ngValue]="a.idAgencia">
            {{ a.nombreAgencia }}
          </option>
        </select>
      </div>

      <div class="form-actions full">

        <button
          type="button"
          class="btn btn--secondary"
          (click)="cancelar()">
          Cancelar
        </button>

        <button
          type="submit"
          class="btn btn--primary"
          [disabled]="form.invalid">
          Guardar
        </button>

      </div>

    </form>

  </div>

</div>
