<div class="bloques-upsert">

  <h5>
    {{ route.snapshot.paramMap.get('id')
    ? 'editar bloque'
    : 'nuevo bloque' }}
  </h5>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="form-grid">

    <div class="form-group sm">
      <label>código *</label>
      <input type="text" formControlName="codigoBloque" />
    </div>

    <div class="form-group full">
      <label>nombre *</label>
      <input type="text" formControlName="nombreBloque" />
    </div>

    <div class="form-group sm">
      <label>meses depreciación *</label>
      <input type="number" formControlName="mesesDepreciacionDefecto" />
    </div>

    <div class="form-actions full">
      <button
        class="btn sm primary"
        type="submit"
        [disabled]="form.invalid">
        💾 guardar
      </button>

      <button
        class="btn sm danger"
        type="button"
        (click)="cancelar()">
        ↩️ cancelar
      </button>
    </div>

  </form>
</div>
