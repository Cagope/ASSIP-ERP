<div class="page">

  <div class="card bloque-form-card">

    <div class="form-title">
      <h3>
        {{ route.snapshot.paramMap.get('id') ? 'Editar bloque' : 'Nuevo bloque' }}
      </h3>
      <p>Configuración de bloques y depreciación</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="guardar()" class="form-grid">

      <div class="form-group sm">
        <label>Código *</label>
        <input
          type="text"
          class="form-control"
          formControlName="codigoBloque" />
      </div>

      <div class="form-group full">
        <label>Nombre *</label>
        <input
          type="text"
          class="form-control"
          formControlName="nombreBloque" />
      </div>

      <div class="form-group sm">
        <label>Meses depreciación *</label>
        <input
          type="number"
          class="form-control"
          formControlName="mesesDepreciacionDefecto" />
      </div>

      <div class="form-actions full">

        <button
          type="button"
          class="btn btn--secondary"
          (click)="cancelar()">
          Cancelar
        </button>

        <button
          type="submit"
          class="btn btn--primary"
          [disabled]="form.invalid">
          Guardar
        </button>

      </div>

    </form>

  </div>

</div>
