<div class="concepto-cuentas-contables-list">

  <app-header-actions
    titulo="Concepto · Cuentas Contables"
    (nuevo)="nuevo()"
    (refrescar)="cargar()"
    (imprimir)="imprimir()"
    (exportar)="exportar()">
  </app-header-actions>

  <!-- =========================
       TOOLBAR
       ========================= -->
  <div class="toolbar">
    <input
      type="text"
      class="form-control"
      placeholder="Buscar por concepto, agencia o cuenta..."
      [(ngModel)]="q"
    />
  </div>

  <!-- =========================
       TABLA
       ========================= -->
  <table
    class="table"
    *ngIf="!loading && filtrados.length > 0; else vacio">

    <thead>
    <tr>
      <th style="width:140px;">Concepto</th>
      <th style="width:220px;">Agencia</th>
      <th>Cuenta Débito</th>
      <th>Cuenta Crédito</th>
      <th style="width:90px;">Activo</th>
      <th style="width:120px;">Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr *ngFor="let x of filtrados">

      <td>
        <strong>{{ x.codigoConcepto }}</strong>
      </td>

      <td class="nombre">
        {{ x.nombreAgencia }}
      </td>

      <td>
        {{ x.cuentaDebito }}
      </td>

      <td>
        {{ x.cuentaCredito }}
      </td>

      <td class="center">
          <span
            class="badge"
            [class.badge--ok]="x.activo"
            [class.badge--off]="!x.activo">
            {{ x.activo ? 'SI' : 'NO' }}
          </span>
      </td>

      <td>
        <div class="acciones">
          <button
            class="btn sm"
            (click)="editar(x.idMapeo)"
            title="Editar">
            ✏️
          </button>

          <button
            class="btn sm danger"
            (click)="eliminar(x.idMapeo)"
            title="Eliminar">
            🗑️
          </button>
        </div>
      </td>

    </tr>
    </tbody>

  </table>

  <!-- =========================
       LOADING
       ========================= -->
  <div *ngIf="loading" class="loading">
    Cargando...
  </div>

  <!-- =========================
       VACÍO
       ========================= -->
  <ng-template #vacio>
    <p class="empty">No hay mapeos contables para mostrar.</p>
  </ng-template>

</div>
