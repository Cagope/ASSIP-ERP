<div class="page">

  <h2>Consolidado por conceptos</h2>

  <div class="card">

    <div class="form-grid">

      <div class="form-group">
        <label>Concepto</label>
        <select class="form-control" [(ngModel)]="codigoConcepto">
          <option [ngValue]="null">-- Todos --</option>
          <option *ngFor="let c of conceptos" [ngValue]="c.codigoConcepto">
            {{ c.codigoConcepto }} — {{ c.nombreConcepto }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Tipo</label>
        <select class="form-control" [(ngModel)]="tipoConcepto">
          <option [ngValue]="null">-- Todos --</option>
          <option value="DEVENGADO">Devengado</option>
          <option value="DEDUCCION">Deducción</option>
          <option value="PROVISION">Provisión</option>
        </select>
      </div>

      <div class="form-group">
        <label>Fecha inicial</label>
        <input type="date" class="form-control" [(ngModel)]="fechaInicial">
      </div>

      <div class="form-group">
        <label>Fecha final</label>
        <input type="date" class="form-control" [(ngModel)]="fechaFinal">
      </div>

    </div>

    <div class="actions-process">
      <div class="actions-process-left">
        <button class="btn-work-secondary" (click)="limpiar()">🧹 Limpiar</button>
        <button class="btn-work-secondary" (click)="exportarExcel()" [disabled]="rows.length === 0">
          📄 Exportar
        </button>
      </div>

      <div class="actions-process-right">
        <button class="btn-work-primary" (click)="consultar()">
          🔎 Consultar
        </button>
      </div>
    </div>

  </div>

  <div class="card resumen" *ngIf="rows.length > 0">
    <strong>Total general:</strong> {{ totalGeneral | number }}
  </div>

  <div class="card tabla-card">

    <table class="table table-sm table-bordered table-hover" *ngIf="rows.length > 0">

      <thead>
      <tr>
        <th>Concepto</th>
        <th>Nombre</th>
        <th>Tipo</th>
        <th>Registros</th>
        <th>Cantidad</th>
        <th>Valor</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let r of rows">
        <td>{{ r.codigoConcepto }}</td>
        <td>{{ r.nombreConcepto }}</td>
        <td>{{ r.tipoConcepto }}</td>
        <td class="text-end">{{ r.cantidadRegistros }}</td>
        <td class="text-end">{{ r.totalCantidad }}</td>
        <td class="text-end">{{ r.totalValor | number }}</td>
      </tr>
      </tbody>

    </table>

  </div>

</div>
