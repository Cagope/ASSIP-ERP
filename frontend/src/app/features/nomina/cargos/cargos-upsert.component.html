<div class="page">

  <app-header-actions
    title="Cargos Nómina"
    subtitle="Crear / Editar"
  ></app-header-actions>

  <div class="card" *ngIf="!loading; else cargandoTpl">

    <div class="form-grid">

      <div class="form-group full">
        <label>Nombre cargo *</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="form.nombreCargo"
          placeholder="Ej: Contador"
        />
      </div>

      <div class="form-group">
        <label>Activo</label>
        <select class="form-control" [(ngModel)]="form.activo">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>

    </div>

    <div class="form-actions">

      <button
        type="button"
        class="btn btn--secondary"
        (click)="volver()"
        [disabled]="guardando">
        ❌ Cancelar
      </button>

      <button
        type="button"
        class="btn btn--primary"
        (click)="guardar()"
        [disabled]="guardando">
        {{ guardando ? '⏳ Guardando...' : '💾 Guardar' }}
      </button>

    </div>
  </div>

  <ng-template #cargandoTpl>
    <div class="loading">Cargando...</div>
  </ng-template>

</div>
