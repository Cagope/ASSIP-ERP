<div class="page">

  <app-header-actions
    [titulo]="codigo ? 'Editar Concepto Nómina' : 'Nuevo Concepto Nómina'">
  </app-header-actions>

  <div class="card" *ngIf="!loading; else cargandoTpl">

    <div class="form-grid">

      <!-- =========================
           DATOS BÁSICOS
           ========================= -->

      <div class="form-group">
        <label>Código *</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="form.codigoConcepto"
          [disabled]="!!codigo"
        />
      </div>

      <div class="form-group full">
        <label>Nombre *</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="form.nombreConcepto"
        />
      </div>

      <div class="form-group">
        <label>Tipo *</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="form.tipoConcepto"
        />
      </div>

      <div class="form-group">
        <label>Es fijo</label>
        <select class="form-control" [(ngModel)]="form.esFijo">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>

      <div class="form-group">
        <label>Activo</label>
        <select class="form-control" [(ngModel)]="form.activo">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>

      <!-- =========================
           CÁLCULO
           ========================= -->

      <div class="form-group">
        <label>Tipo cálculo *</label>
        <select class="form-control" [(ngModel)]="form.tipoCalculo">
          <option value="MANUAL">Manual</option>
          <option value="POR_DIAS">Por días</option>
          <option value="POR_HORAS">Por horas</option>
          <option value="POR_PORCENTAJE">Por porcentaje</option>
          <option value="AUX_TRANSPORTE">Auxilio de transporte</option>
        </select>
      </div>

      <div class="form-group">
        <label>Base cálculo</label>

        <select class="form-control" [(ngModel)]="form.baseCalculo">

          <option [ngValue]="null">-- No aplica --</option>

          <option value="SALARIO_BASE">Salario base</option>
          <option value="IBC">IBC</option>

        </select>
      </div>

      <div class="form-group">
        <label>Multiplicador</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="form.multiplicador"
          step="0.01"
        />
      </div>

      <!-- =========================
           AFECTA BASES
           ========================= -->

      <div class="form-group">
        <label>Afecta IBC</label>
        <select class="form-control" [(ngModel)]="form.afectaIbc">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>

      <div class="form-group">
        <label>Base cesantías</label>
        <select class="form-control" [(ngModel)]="form.afectaBaseCesantias">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>

      <div class="form-group">
        <label>Base prima legal</label>
        <select class="form-control" [(ngModel)]="form.afectaBasePrimaLegal">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>

      <div class="form-group">
        <label>Base vacaciones</label>
        <select class="form-control" [(ngModel)]="form.afectaBaseVacaciones">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>

      <div class="form-group">
        <label>Base prima semestral</label>
        <select class="form-control" [(ngModel)]="form.afectaBasePrimaSemestral">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>

      <div class="form-group">
        <label>Base ARL</label>
        <select class="form-control" [(ngModel)]="form.afectaBaseArl">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>

      <div class="form-group">
        <label>Base parafiscales</label>
        <select class="form-control" [(ngModel)]="form.afectaBaseParafiscales">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>

      <!-- =========================
           RANGO SMMLV
           ========================= -->

      <div class="form-group">
        <label>SMMLV desde</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="form.smmlvDesde"
        />
      </div>

      <div class="form-group">
        <label>SMMLV hasta</label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="form.smmlvHasta"
        />
      </div>

    </div>

    <!-- =========================
         ACCIONES
         ========================= -->

    <div class="form-actions">

      <button
        type="button"
        class="btn btn--secondary"
        (click)="volver()"
        [disabled]="guardando">
        ❌ Cancelar
      </button>

      <button
        type="button"
        class="btn btn--primary"
        (click)="guardar()"
        [disabled]="guardando">
        {{ guardando ? '⏳ Guardando...' : '💾 Guardar' }}
      </button>

    </div>

  </div>

  <ng-template #cargandoTpl>
    <div class="loading">Cargando...</div>
  </ng-template>

</div>
