<div class="page">

  <app-header-actions
    [titulo]="codigo ? 'Editar Concepto Nómina' : 'Nuevo Concepto Nómina'"
    subtitulo="Crear / Editar"
  ></app-header-actions>

  <div class="card" *ngIf="!loading; else cargandoTpl">

    <div class="form-grid">

      <div class="form-group">
        <label>Código *</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="form.codigo"
          [disabled]="!!codigo"
          placeholder="Ej: BASICO"
        />
      </div>

      <div class="form-group full">
        <label>Nombre *</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="form.nombre"
          placeholder="Ej: Salario básico"
        />
      </div>

      <div class="form-group">
        <label>Tipo *</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="form.tipo"
          placeholder="Ej: DEVENGADO / DEDUCCION"
        />
      </div>

      <div class="form-group">
        <label>Es fijo</label>
        <select class="form-control" [(ngModel)]="form.esFijo">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>

      <div class="form-group">
        <label>Activo</label>
        <select class="form-control" [(ngModel)]="form.activo">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>

    </div>

    <div class="actions">
      <button class="btn btn-primary" (click)="guardar()" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>

      <button class="btn btn-light" (click)="volver()" [disabled]="guardando">
        Cancelar
      </button>
    </div>

  </div>

  <ng-template #cargandoTpl>
    <div class="loading">Cargando...</div>
  </ng-template>

</div>
