<div class="form-container">
  <h5>{{ route.snapshot.paramMap.get('id') ? 'editar subzona' : 'nueva subzona' }}</h5>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="form-grid">

    <!-- 🟩 Identificación -->
    <div class="form-group sm">
      <label for="codigoSubZona">código *</label>
      <input id="codigoSubZona" type="text" formControlName="codigoSubZona" maxlength="5" />
    </div>

    <div class="form-group full">
      <label for="nombreSubZona">nombre *</label>
      <input id="nombreSubZona" type="text" formControlName="nombreSubZona" maxlength="100" />
    </div>

    <!-- 🟦 Relación -->
    <div class="form-group full">
      <label for="idZona">zona *</label>
      <select id="idZona" formControlName="idZona">
        <option [ngValue]="null">Seleccione una zona</option>
        <option *ngFor="let z of zonas" [ngValue]="z.idZona">
          {{ z.nombreZona }}
        </option>
      </select>
    </div>

    <!-- 🟧 Comentario -->
    <div class="form-group full">
      <label for="comentarioSubZona">comentario</label>
      <input id="comentarioSubZona" type="text" formControlName="comentarioSubZona" maxlength="150" />
    </div>

    <div class="form-actions full">

      <button
        type="button"
        class="btn btn--secondary"
        (click)="router.navigate(['/general/sub-zonas'])">
        Cancelar
      </button>

      <button
        type="submit"
        class="btn btn--primary"
        [disabled]="form.invalid">
        {{ route.snapshot.paramMap.get('id') ? 'Actualizar' : 'Guardar' }}
      </button>

    </div>
  </form>
</div>
