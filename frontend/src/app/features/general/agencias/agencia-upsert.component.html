<div class="form-container">
  <h5>{{ id ? 'editar agencia' : 'nueva agencia' }}</h5>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="form-grid">

    <!-- 🟩 Identificación -->
    <div class="form-group sm">
      <label for="codigoAgencia">código *</label>
      <input id="codigoAgencia" type="text" formControlName="codigoAgencia" maxlength="5" />
    </div>

    <div class="form-group full">
      <label for="nombreAgencia">nombre *</label>
      <input id="nombreAgencia" type="text" formControlName="nombreAgencia" maxlength="100" />
    </div>

    <div class="form-group full">
      <label for="siglaAgencia">sigla</label>
      <input id="siglaAgencia" type="text" formControlName="siglaAgencia" maxlength="100" />
    </div>

    <!-- 🟦 Dirección -->
    <div class="form-group full">
      <label for="direccionAgencia">dirección</label>
      <input id="direccionAgencia" type="text" formControlName="direccionAgencia" maxlength="100" />
    </div>

    <!-- 🟩 Ubicación -->
    <div class="form-group md">
      <label for="idDepartamento">departamento</label>
      <select id="idDepartamento" formControlName="idDepartamento">
        <option value="">-- seleccione --</option>
        <option *ngFor="let d of departamentos" [value]="d.idDepartamento">
          {{ d.nombreDepartamento }}
        </option>
      </select>
    </div>

    <div class="form-group md">
      <label for="idCiudad">ciudad</label>
      <select id="idCiudad" formControlName="idCiudad">
        <option value="">-- seleccione --</option>
        <option *ngFor="let c of ciudades" [value]="c.idCiudad">
          {{ c.nombreCiudad }}
        </option>
      </select>
    </div>

    <!-- 🟩 Contacto -->
    <div class="form-group md">
      <label for="correoAgencia">correo</label>
      <input id="correoAgencia" type="email" formControlName="correoAgencia" maxlength="80" />
    </div>

    <div class="form-group sm">
      <label for="celularAgencia">celular</label>
      <input id="celularAgencia" type="text" formControlName="celularAgencia" maxlength="10" />
    </div>

    <div class="form-group sm">
      <label for="telefonoAgencia">teléfono</label>
      <input id="telefonoAgencia" type="text" formControlName="telefonoAgencia" maxlength="10" />
    </div>

    <!-- 🟨 Acciones -->
    <div class="form-actions full">
      <button
        type="submit"
        class="btn btn--primary"
        [disabled]="cargando">
        {{ id ? 'Actualizar' : 'Guardar' }}
      </button>

      <button
        type="button"
        class="btn btn--cancel"
        (click)="cancelar()">
        Cancelar
      </button>
    </div>
  </form>

  <div *ngIf="cargando" class="loading">procesando...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
</div>
