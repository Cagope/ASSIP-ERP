<div class="usuarios-list">

  <app-header-actions
    titulo="Usuarios"
    [mostrarNuevo]="true"
    [mostrarExportar]="false"
    [mostrarImprimir]="false"
    (nuevo)="nuevo()">
  </app-header-actions>

  <table
    *ngIf="!cargando() && usuarios().length > 0"
    class="table table-striped">

    <thead>
    <tr>
      <th>Usuario</th>
      <th>Nombre completo</th>
      <th>Correo electrónico</th>
      <th>Roles</th>
      <th>Estado</th>
      <th>Acciones</th>
    </tr>
    </thead>

    <tbody>

    <tr *ngFor="let u of usuarios()">

      <td>
        {{ u.username }}
      </td>

      <td>
        {{ u.nombreCompleto }}
      </td>

      <td>
        {{ u.email || '—' }}
      </td>

      <td>
        {{ nombresRoles(u) || '—' }}
      </td>

      <td>
        <span
          class="badge"
          [class.badge-success]="u.activo"
          [class.badge-danger]="!u.activo">

          {{ u.activo ? 'Activo' : 'Inactivo' }}

        </span>
      </td>

      <td>
        <div class="acciones">

          <button
            class="btn-action-edit"
            type="button"
            (click)="editar(u.idUsuario)"
            title="Editar">
            ✏️
          </button>

        </div>
      </td>

    </tr>

    </tbody>

  </table>


  <div
    *ngIf="cargando()"
    class="loading">
    Cargando usuarios...
  </div>


  <div
    *ngIf="!cargando() && usuarios().length === 0"
    class="empty">
    No hay usuarios registrados.
  </div>

</div>
