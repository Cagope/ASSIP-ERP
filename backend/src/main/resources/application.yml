spring:
  application:
    name: assip-erp-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/assip_erp?currentSchema=seguridad,catalogos,general,hoja_vida,contabilidad,depositos,cartera,activos_fijos,nomina,tesoreria,reporting,public
    username: postgres
    password: Cagope1234+
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none     # Flyway controla las migraciones, no Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    create-schemas: true           # ✅ Crea esquemas si no existen
    baseline-on-migrate: true      # ✅ Marca la base como baseline si está vacía
    validate-on-migrate: true      # ✅ Valida integridad de migraciones
    out-of-order: true             # ✅ Aplica migraciones aunque lleguen fuera de orden
    ignore-missing-migrations: true  # ✅ No falla si faltan scripts antiguos
    ignore-future-migrations: true   # ✅ No falla si hay migraciones más nuevas en la BD
    clean-disabled: false            # ✅ Permite limpiar (solo desarrollo)
    group: true                      # Ejecuta todas las migraciones en bloque

    # 📁 Ubicación de scripts SQL de migración
    locations: classpath:db/migration

    # 🧩 Configuración de esquemas
    default-schema: seguridad
    schemas: seguridad, catalogos, general, hoja_vida, contabilidad, depositos, cartera, activos_fijos, nomina, tesoreria, reporting

    # 🏷️ Control de versiones dentro del esquema de seguridad
    table: flyway_schema_history

    placeholders:
      app_user: postgres

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    root: info
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql: off
    org.hibernate.orm.jdbc.bind: off
    org.springframework.orm.jpa: warn
    org.springframework.jdbc.core: warn
    org.flywaydb.core.internal.command: debug   # 🔍 Detalle de ejecución Flyway
    org.flywaydb.core.internal.sqlscript: debug # 🔍 Detalle línea a línea
